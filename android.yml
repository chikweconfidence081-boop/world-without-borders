# Builds a signed Android APK using repository Actions secrets.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ runner.temp }}/wwb-release.keystore
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3

      - name: Check signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASS" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$STORE_PASS" || (echo "Missing ANDROID_STORE_PASSWORD" && exit 1)
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor "#1B2A4A" --splashBackgroundColor "#1B2A4A"
        continue-on-error: true
      - name: Copy the game into the app
        run: npx cap sync android
      - name: Set version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out WorldWithoutBorders3D.apk aligned.apk
          "$BT/apksigner" verify --print-certs WorldWithoutBorders3D.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: WorldWithoutBorders3D-android
          path: WorldWithoutBorders3D.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WorldWithoutBorders3D.apk
